// =====================================================================================
// UTIL — RNG, noise, easing, temp objects, geometry helpers
// =====================================================================================
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rr = (a, b) => a + Math.random() * (b - a);
const rrng = (rng, a, b) => a + rng() * (b - a);
const rint = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));
function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
  return arr;
}
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth01 = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeOutQuad = (t) => 1 - (1 - t) * (1 - t);
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
function wrapAngle(a) { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; }
function fmtTime(sec) {
  if (sec == null || !isFinite(sec)) return '--:--';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60), cs = Math.floor((sec * 100) % 100);
  return m + ':' + String(s).padStart(2, '0') + '.' + String(cs).padStart(2, '0');
}
function fmtClock(sec) { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }

// Seeded 2D value noise (smooth, deterministic)
function makeValueNoise(seed) {
  const rng = mulberry32(seed);
  const perm = new Uint16Array(512), vals = new Float32Array(256);
  for (let i = 0; i < 256; i++) { perm[i] = i; vals[i] = rng(); }
  for (let i = 255; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  for (let i = 0; i < 256; i++) perm[i + 256] = perm[i];
  const h = (x, y) => vals[perm[(perm[x & 255] + y) & 511]];
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  };
}

// Reusable temporaries (no per-frame allocation in the update loop)
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3(), _v4 = new THREE.Vector3();
const _v5 = new THREE.Vector3(), _v6 = new THREE.Vector3(), _v7 = new THREE.Vector3(), _v8 = new THREE.Vector3();
const _q1 = new THREE.Quaternion(), _q2 = new THREE.Quaternion();
const _m1 = new THREE.Matrix4(), _m2 = new THREE.Matrix4();
const _e1 = new THREE.Euler();
const _c1 = new THREE.Color(), _c2 = new THREE.Color();
const _s1 = new THREE.Vector3(1, 1, 1);
const UP = new THREE.Vector3(0, 1, 0);
const _ray = new THREE.Raycaster();
const _hits = [];

// Closest distance between point p and segment ab
function distPointSeg(p, a, b) {
  const abx = b.x - a.x, aby = b.y - a.y, abz = b.z - a.z;
  const apx = p.x - a.x, apy = p.y - a.y, apz = p.z - a.z;
  const len2 = abx * abx + aby * aby + abz * abz;
  let t = len2 > 1e-9 ? (apx * abx + apy * aby + apz * abz) / len2 : 0;
  t = clamp(t, 0, 1);
  const dx = apx - abx * t, dy = apy - aby * t, dz = apz - abz * t;
  return Math.sqrt(dx * dx + dy * dy + dz * dz);
}
// Closest distance between segments p1-q1 and p2-q2 (Ericson, Real-Time Collision Detection)
function distSegSeg(p1, q1, p2, q2) {
  const d1x = q1.x - p1.x, d1y = q1.y - p1.y, d1z = q1.z - p1.z;
  const d2x = q2.x - p2.x, d2y = q2.y - p2.y, d2z = q2.z - p2.z;
  const rx = p1.x - p2.x, ry = p1.y - p2.y, rz = p1.z - p2.z;
  const a = d1x * d1x + d1y * d1y + d1z * d1z, e = d2x * d2x + d2y * d2y + d2z * d2z;
  const f = d2x * rx + d2y * ry + d2z * rz;
  let s, t;
  if (a <= 1e-9 && e <= 1e-9) { s = t = 0; }
  else if (a <= 1e-9) { s = 0; t = clamp(f / e, 0, 1); }
  else {
    const c = d1x * rx + d1y * ry + d1z * rz;
    if (e <= 1e-9) { t = 0; s = clamp(-c / a, 0, 1); }
    else {
      const b = d1x * d2x + d1y * d2y + d1z * d2z, denom = a * e - b * b;
      s = denom !== 0 ? clamp((b * f - c * e) / denom, 0, 1) : 0;
      t = (b * s + f) / e;
      if (t < 0) { t = 0; s = clamp(-c / a, 0, 1); } else if (t > 1) { t = 1; s = clamp((b - c) / a, 0, 1); }
    }
  }
  const cx = (p1.x + d1x * s) - (p2.x + d2x * t), cy = (p1.y + d1y * s) - (p2.y + d2y * t), cz = (p1.z + d1z * s) - (p2.z + d2z * t);
  return Math.sqrt(cx * cx + cy * cy + cz * cz);
}

// Game clock: waits/timers tick only while the game is not paused
const Clock = {
  t: 0, real: 0, waits: [],
  update(dt) {
    this.t += dt;
    for (let i = this.waits.length - 1; i >= 0; i--) {
      const w = this.waits[i];
      if (this.t >= w.t) { this.waits.splice(i, 1); w.res(); }
    }
  },
};
function wait(sec) { return new Promise((res) => Clock.waits.push({ t: Clock.t + sec, res })); }

// Persistent save data (localStorage wrapped in try/catch; works without storage)
const Save = {
  key: 'wega-vr-idol-v1',
  data: null,
  defaults() {
    return {
      settings: {
        turn: 1,            // 0 snap30, 1 snap45, 2 smooth
        turnSpeed: 90,      // deg/s
        moveDir: 0,         // 0 head, 1 controller
        swap: false,
        vignette: 1,        // 0 off, 1 low, 2 high
        floatHud: true,
        seated: false,
        reduceFlash: false,

    };

  },
  save() { try { if (window.localStorage) localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* ignore */ } },
  get s() { return this.data.settings; },
};
const diff = () => CONFIG.DIFF[Save.s.difficulty] || CONFIG.DIFF.normal;
const playerName = () => CONFIG.NAMES[Save.data.nameIdx] || 'GOLDEN SIGMA';

// =====================================================================================
// AUDIO — WegaMusic cue helpers, synthesized SFX, positional audio
// =====================================================================================
const AudioSys = {
  ctx: null, out: null, sfxGain: null, noiseBuf: null, distCurve: null, crushCurve: null,
  started: false, muted: false, hasMusic: false,
  // Call from inside a user gesture (button click, VR button, trigger press).
  ensure() {
    if (this.started) {
      if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) { /* ignore */ } }
      return;
    }
    this.started = true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { Music.status = 'NO AUDIO'; return; }
    try { this.ctx = new AC(); } catch (e) { Music.status = 'NO AUDIO'; return; }
    const c = this.ctx;
    if (window.WegaMusic && typeof window.WegaMusic.init === 'function') {
      try {
        Music.captureBaseGains();
        Music.status = 'LOADING MUSIC…';
        const p = window.WegaMusic.init(c);
        this.out = window.WegaMusic.getMasterNode();
        this.hasMusic = !!this.out;
        Promise.resolve(p).then(() => Music.onReady()).catch((e) => { console.warn('[Wega] music failed to decode', e); Music.status = 'MUSIC UNAVAILABLE'; Music.failed = true; UI.onMusicStatus(); });
      } catch (e) { console.warn('[Wega] WegaMusic.init failed', e); this.out = null; Music.status = 'MUSIC UNAVAILABLE'; }
    } else {
      Music.status = 'MUSIC UNAVAILABLE';
    }
    if (!this.out) { this.out = c.createGain(); this.out.gain.value = 0.8; this.out.connect(c.destination); }
    this.sfxGain = c.createGain();
    this.sfxGain.connect(this.out);
    // shared 2 s white-noise buffer
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    // waveshaper curves: soft distortion + step-quantize bitcrusher
    const n = 1024; this.distCurve = new Float32Array(n); this.crushCurve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      this.distCurve[i] = ((3 + 18) * x * 20 * Math.PI / 180) / (Math.PI + 18 * Math.abs(x));
      this.crushCurve[i] = Math.round(x * 6) / 6;
    }
    this.updateSfxGain(0);
    if (c.state === 'suspended') { try { c.resume(); } catch (e) { /* ignore */ } }
    UI.onMusicStatus();
  },
  get t() { return this.ctx ? this.ctx.currentTime : 0; },
  // SFX loudness = sfxVol * (master level); the master is scaled by the music volume, so compensate for it.
  updateSfxGain(secs) {
    if (!this.sfxGain) return;
    const target = this.muted ? 0 : (this.hasMusic ? Save.s.sfxVol / Music.mvEff() : Save.s.sfxVol);
    const p = this.sfxGain.gain, now = this.ctx.currentTime;
    p.cancelScheduledValues(now); p.setValueAtTime(p.value, now);
    p.linearRampToValueAtTime(target, now + Math.max(0.01, secs || 0.01));
  },
  toggleMute() {
    this.muted = !this.muted;
    if (Music.ok()) window.WegaMusic.setVolume(this.muted ? 0 : Music.desired.level * Music.mvEff(), 0.1);
    else if (this.out && !this.hasMusic) this.out.gain.value = this.muted ? 0 : 0.8;
    this.updateSfxGain(0.1);
    UI.announce(this.muted ? 'MUTED' : 'SOUND ON', { short: true });
  },
  // Listener follows the camera's world transform every frame
  updateListener() {
    const c = this.ctx; if (!c) return;
    const L = c.listener;
    camera.getWorldPosition(_v1);
    camera.getWorldDirection(_v2);
    _v3.set(0, 1, 0).applyQuaternion(camera.getWorldQuaternion(_q1));
    if (L.positionX) {
      L.positionX.value = _v1.x; L.positionY.value = _v1.y; L.positionZ.value = _v1.z;
      L.forwardX.value = _v2.x; L.forwardY.value = _v2.y; L.forwardZ.value = _v2.z;
      L.upX.value = _v3.x; L.upY.value = _v3.y; L.upZ.value = _v3.z;
    } else if (L.setPosition) {
      L.setPosition(_v1.x, _v1.y, _v1.z);
      L.setOrientation(_v2.x, _v2.y, _v2.z, _v3.x, _v3.y, _v3.z);
    }
  },
};

// ---------------- Music cue sheet (wraps WegaMusic; every call guarded) ----------------
const Music = {
  status: 'LOADING MUSIC…',
  failed: false,
  desired: { track: null, muffled: true, level: 0.45, rate: 1 },
  baseGains: null, wasSilent: false, deathTok: 0, warbleTok: 0,
  ok() { return !!(window.WegaMusic && AudioSys.ctx && !this.failed && window.WegaMusic.isReady && window.WegaMusic.isReady()); },
  mvEff() { return Math.max(0.05, Save.s.musicVol); },
  captureBaseGains() {
    if (this.baseGains || !window.WegaMusic || !window.WegaMusic.data) return;
    this.baseGains = {};
    for (const k of Object.keys(window.WegaMusic.data)) this.baseGains[k] = window.WegaMusic.data[k].gain;
    this.applyTrackGains();
  },
  // Music volume 0 => zero track gain (the master never reaches 0 because SFX share it)
  applyTrackGains() {
    if (!this.baseGains) return;
    const silent = Save.s.musicVol <= 0.001;
    for (const k of Object.keys(this.baseGains)) window.WegaMusic.data[k].gain = silent ? 0 : this.baseGains[k];
    if (silent !== this.wasSilent && this.ok() && window.WegaMusic.currentTrack()) window.WegaMusic.play(window.WegaMusic.currentTrack(), 0.2);
    this.wasSilent = silent;
  },
  onVolumeSetting() {
    this.applyTrackGains();
    if (this.ok() && !AudioSys.muted) window.WegaMusic.setVolume(this.desired.level * this.mvEff(), 0.1);
    AudioSys.updateSfxGain(0.1);
  },
  onReady() {
    this.status = 'READY';
    this.applyDesired(true);
    UI.onMusicStatus();
  },
  // Re-apply the whole desired state (used when the music finishes decoding mid-game)
  applyDesired(startTrack) {
    if (!this.ok()) return;
    const W = window.WegaMusic, d = this.desired;
    W.setRate(d.rate, 0.05);
    W.setMuffled(d.muffled, 0.05);
    W.setVolume(AudioSys.muted ? 0 : d.level * this.mvEff(), 0.1);
    if (startTrack && d.track && W.currentTrack() !== d.track) W.play(d.track, 0.4);
  },
  setLevel(level, secs) {
    this.desired.level = level;
    if (this.ok() && !AudioSys.muted) window.WegaMusic.setVolume(level * this.mvEff(), secs);
  },
  setMuffled(on, secs) { this.desired.muffled = on; if (this.ok()) window.WegaMusic.setMuffled(on, secs); },
  setRate(r, secs) { this.desired.rate = r; if (this.ok()) window.WegaMusic.setRate(r, secs); },
  play(track, fadeIn) {
    this.desired.track = track;
    if (this.ok()) { window.WegaMusic.setRate(this.desired.rate, 0.01); window.WegaMusic.play(track, fadeIn); }
  },
  stop(secs) { this.desired.track = null; if (this.ok()) window.WegaMusic.stop(secs); },
  toast(track) {
    let title = track === 'lap1' ? 'WEXECUTION' : 'WEGAFADENCE';
    try { if (window.WegaMusic && window.WegaMusic.data[track]) title = window.WegaMusic.data[track].title.split('(')[0].trim(); } catch (e) { /* ignore */ }
    UI.toast('♪ ' + title.toUpperCase());
  },
  getLevel() { if (!this.ok()) return 0; try { return window.WegaMusic.getLevel(); } catch (e) { return 0; } },

  // --- cue sheet rows ---
  cueLobby() {
    this.deathTok++;
    this.desired.rate = 1; this.setRate(1, 0.05);
    this.setMuffled(true, 0.4);
    this.setLevel(0.45, 0.6);
    if (this.desired.track !== 'lap1' || !this.ok() || window.WegaMusic.currentTrack() !== 'lap1') this.play('lap1', 1.0);
  },
  cueLap1Start() {
    this.deathTok++;
    this.setRate(1, 0.05);
    this.setMuffled(false, 0.6);
    this.setLevel(0.8, 0.4);
    this.desired.track = 'lap1';
    if (this.ok()) { if (window.WegaMusic.currentTrack() === 'lap1') window.WegaMusic.restart(); else window.WegaMusic.play('lap1', 0.05); }
    this.toast('lap1');
  },
  cuePause(on) { this.setMuffled(on, on ? 0.3 : 0.4); },
  cueEnragedStop() { this.stop(0.4); },
  cueLap2Start() {
    this.deathTok++;
    this.setRate(1, 0.05);
    this.setMuffled(false, 0.2);
    this.setLevel(0.8, 0.2);
    this.play('lap2', 0.05);
    this.toast('lap2');
  },
  cueLap2Tension() { this.setRate(1.04, 2); },
  cueChamber() { this.setRate(1.0, 0.5); this.setMuffled(true, 1.0); this.setLevel(0.5, 1.0); },
  cueRun() {
    this.setMuffled(false, 0.2); this.setLevel(0.9, 0.3); this.setRate(1.08, 1.0);
    if (this.ok() && window.WegaMusic.currentTrack() !== 'lap2') this.play('lap2', 0.1);
    this.desired.track = 'lap2';
  },
  cueWinText() { this.stop(2.5); },
  cueDeath() {
    const tok = ++this.deathTok;
    this.setRate(0.6, 0.8);
    wait(0.8).then(() => { if (tok === this.deathTok) this.stop(0.8); });
  },
  cueRetry(kind) {
    this.deathTok++;
    this.desired.rate = 1;
    if (kind === 'LAP1') { this.cueLap1Start(); return; }
    if (kind === 'LAP2') { this.setRate(1, 0.01); this.setMuffled(false, 0.1); this.setLevel(0.8, 0.2); this.play('lap2', 0.05); this.toast('lap2'); return; }
    // escape retry: lap 2 track fresh, RUN settings
    this.setRate(1, 0.01); this.play('lap2', 0.05); this.cueRun();
  },
  // Wega Glitch Head "tape warble"
  warble() {
    const tok = ++this.warbleTok, base = this.desired.rate;
    if (this.ok()) window.WegaMusic.setRate(0.85, 0.15);
    wait(0.8).then(() => { if (tok === this.warbleTok && this.ok()) window.WegaMusic.setRate(this.desired.rate || base, 0.3); });
  },
};

// ---------------- SFX synth module ----------------
const Sfx = {
  get ok() { return !!(AudioSys.ctx && AudioSys.sfxGain); },
  env(param, t, a, hold, rel, peak) {
    param.cancelScheduledValues(t);
    param.setValueAtTime(0.0001, t);
    param.linearRampToValueAtTime(peak, t + a);
    param.setValueAtTime(peak, t + a + hold);
    param.exponentialRampToValueAtTime(0.0001, t + a + hold + rel);
  },
  // Oscillator voice with envelope and optional pitch sweep / distortion / bitcrush
  tone(o) {
    if (!this.ok) return null;
    const c = AudioSys.ctx, t = c.currentTime + (o.when || 0);
    const osc = c.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f0, t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t + (o.sweep || o.dur));
    if (o.detune) osc.detune.value = o.detune;
    const g = c.createGain();
    const a = o.attack != null ? o.attack : 0.005, hold = o.hold || 0, rel = Math.max(0.01, o.dur - a - hold);
    this.env(g.gain, t, a, hold, rel, o.vol != null ? o.vol : 0.3);
    let node = osc;
    if (o.shape) { const ws = c.createWaveShaper(); ws.curve = o.shape === 'crush' ? AudioSys.crushCurve : AudioSys.distCurve; node.connect(ws); node = ws; }
    if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; node.connect(f); node = f; }
    node.connect(g); g.connect(o.dest || AudioSys.sfxGain);
    osc.start(t); osc.stop(t + o.dur + 0.05);
    return { osc, g };
  },
  // Filtered noise burst
  noise(o) {
    if (!this.ok) return null;
    const c = AudioSys.ctx, t = c.currentTime + (o.when || 0);
    const src = c.createBufferSource(); src.buffer = AudioSys.noiseBuf; src.loop = true;
    src.playbackRate.value = o.rate || 1;
    const f = c.createBiquadFilter(); f.type = o.filter || 'bandpass'; f.Q.value = o.q != null ? o.q : 1;
    f.frequency.setValueAtTime(o.f0 || 1000, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t + o.dur);
    const g = c.createGain();
    const a = o.attack != null ? o.attack : 0.005, hold = o.hold || 0, rel = Math.max(0.01, o.dur - a - hold);
    this.env(g.gain, t, a, hold, rel, o.vol != null ? o.vol : 0.3);
    let node = f;
    src.connect(f);
    if (o.shape) { const ws = c.createWaveShaper(); ws.curve = o.shape === 'crush' ? AudioSys.crushCurve : AudioSys.distCurve; node.connect(ws); node = ws; }
    node.connect(g); g.connect(o.dest || AudioSys.sfxGain);
    src.start(t, Math.random() * 1.5); src.stop(t + o.dur + 0.05);
    return { src, g };
  },
  // Positional (HRTF) output node: caller updates its position each frame
  panner(x, y, z, autoFree) {
    if (!this.ok) return null;
    const c = AudioSys.ctx, p = c.createPanner();
    p.panningModel = 'HRTF'; p.distanceModel = 'inverse'; p.refDistance = 2.5; p.maxDistance = 80; p.rolloffFactor = 1.1;
    p.connect(AudioSys.sfxGain);
    setPannerPos(p, x, y, z);
    if (autoFree) setTimeout(() => { try { p.disconnect(); } catch (e) { /* ignore */ } }, autoFree * 1000);
    return p;
  },

  // ---- the sound library ----
  collect(combo) {
    const f = 660 * Math.pow(2, Math.min(combo, 30) / 12);
    this.tone({ type: 'square', f0: f, f1: f * 1.5, dur: 0.09, vol: 0.09, sweep: 0.05 });
    this.tone({ type: 'sine', f0: f * 2, dur: 0.12, vol: 0.12, when: 0.015 });
  },
  jump() { this.tone({ type: 'sine', f0: 280, f1: 620, dur: 0.14, vol: 0.12 }); this.noise({ f0: 2500, f1: 900, dur: 0.1, vol: 0.04 }); },
  land() { this.noise({ filter: 'lowpass', f0: 380, dur: 0.11, vol: 0.22 }); this.tone({ type: 'sine', f0: 110, f1: 45, dur: 0.14, vol: 0.2 }); },
  step(speedFrac) { this.noise({ filter: 'lowpass', f0: 260 + 260 * speedFrac, dur: 0.06, vol: 0.05 + 0.05 * speedFrac }); },
  hurt() {
    this.tone({ type: 'sawtooth', f0: 240, f1: 60, dur: 0.32, vol: 0.25, shape: 'dist' });
    this.noise({ filter: 'lowpass', f0: 1800, f1: 200, dur: 0.25, vol: 0.25 });
  },
  honk() {
    this.tone({ type: 'square', f0: 330, f1: 300, dur: 0.32, vol: 0.13, lp: 1800, hold: 0.12 });
    this.tone({ type: 'square', f0: 415, f1: 380, dur: 0.32, vol: 0.11, lp: 1800, hold: 0.12 });
    this.tone({ type: 'square', f0: 330, f1: 280, dur: 0.3, vol: 0.12, lp: 1600, when: 0.36, hold: 0.1 });
  },
  laserPower(pos) {
    const p = pos ? this.panner(pos.x, pos.y, pos.z, 3) : null;
    this.tone({ type: 'sawtooth', f0: 70, f1: 240, dur: 1.2, vol: 0.12, lp: 900, attack: 0.9, dest: p || undefined });
  },
  sizzle() { this.noise({ filter: 'highpass', f0: 3200, dur: 0.45, vol: 0.28 }); this.tone({ type: 'sawtooth', f0: 1200, f1: 400, dur: 0.3, vol: 0.06, shape: 'crush' }); },
  scream(p) {
    const dest = p || undefined;
    this.tone({ type: 'sawtooth', f0: 380, f1: 1500, dur: 1.15, vol: 0.13, attack: 0.6, lp: 3200, dest });
    this.tone({ type: 'sawtooth', f0: 395, f1: 1580, dur: 1.15, vol: 0.1, attack: 0.6, detune: 30, lp: 2400, dest });
    this.noise({ filter: 'bandpass', f0: 900, f1: 2600, q: 3, dur: 1.15, vol: 0.12, attack: 0.5, dest });
  },
  dashWhoosh() { this.noise({ filter: 'bandpass', f0: 3200, f1: 300, q: 1.5, dur: 0.45, vol: 0.32 }); },
  roryThump(p) { this.tone({ type: 'sine', f0: 95, f1: 40, dur: 0.16, vol: 0.5, dest: p }); this.noise({ filter: 'lowpass', f0: 300, dur: 0.08, vol: 0.25, dest: p }); },
  roryWhistle(p, step) {
    const notes = [880, 988, 784, 659, 740, 880, 1175, 988];
    const f = notes[step % notes.length];
    this.tone({ type: 'sine', f0: f, f1: f * 0.94, dur: 0.38, vol: 0.13, attack: 0.04, dest: p });
    this.tone({ type: 'triangle', f0: f * 2, dur: 0.3, vol: 0.03, attack: 0.04, dest: p });
  },
  sting() {
    this.tone({ type: 'sawtooth', f0: 160, f1: 820, dur: 0.95, vol: 0.12, lp: 2200, attack: 0.5 });
    this.tone({ type: 'square', f0: 120, f1: 615, dur: 0.95, vol: 0.06, lp: 1600, attack: 0.5, detune: -20 });
  },
  whoosh(p) { this.noise({ filter: 'bandpass', f0: 2200, f1: 240, q: 1.2, dur: 0.7, vol: 0.25, dest: p || undefined }); },
  boom(p, big) {
    const dest = p || undefined;
    this.tone({ type: 'sine', f0: big ? 70 : 110, f1: 28, dur: big ? 2.2 : 0.8, vol: big ? 0.7 : 0.45, shape: 'dist', dest });
    this.noise({ filter: 'lowpass', f0: big ? 500 : 900, f1: 80, dur: big ? 1.8 : 0.6, vol: big ? 0.5 : 0.35, dest });
  },
  glitch() {
    for (let i = 0; i < 5; i++) this.tone({ type: 'square', f0: rr(200, 2200), f1: rr(100, 3000), dur: 0.05, vol: 0.07, when: i * 0.045, shape: 'crush' });
    this.noise({ filter: 'highpass', f0: 2500, dur: 0.22, vol: 0.08, shape: 'crush' });
  },
  roar() {
    this.tone({ type: 'sawtooth', f0: 150, f1: 48, dur: 2.0, vol: 0.32, attack: 0.08, hold: 0.6, shape: 'dist', lp: 1400 });
    this.tone({ type: 'sawtooth', f0: 157, f1: 44, dur: 2.0, vol: 0.26, attack: 0.08, hold: 0.6, shape: 'dist', lp: 1100, detune: 40 });
    this.tone({ type: 'square', f0: 75, f1: 30, dur: 2.0, vol: 0.18, attack: 0.1, hold: 0.5, lp: 500 });
    this.noise({ filter: 'bandpass', f0: 700, f1: 200, q: 0.8, dur: 1.8, vol: 0.45, attack: 0.05, shape: 'dist' });
  },
  laugh(p) {
    const dest = p || undefined;
    for (let i = 0; i < 7; i++) {
      const f = 330 - i * 18;
      this.tone({ type: 'sawtooth', f0: f, f1: f * 0.72, dur: 0.15, vol: 0.2, when: i * 0.17, shape: 'crush', lp: 2600, dest });
      this.noise({ filter: 'bandpass', f0: 1400, q: 2, dur: 0.1, vol: 0.06, when: i * 0.17, dest });
    }
  },
  beacon() { [880, 1108.7, 1318.5, 1760].forEach((f, i) => this.tone({ type: 'sine', f0: f, dur: 0.6, vol: 0.12, when: i * 0.09 })); },
  idolChord() {
    [261.6, 329.6, 392, 493.9, 523.2].forEach((f, i) => {
      this.tone({ type: 'sawtooth', f0: f, dur: 3.0, vol: 0.05, attack: 0.5, hold: 1.2, lp: 1500, detune: -8 });
      this.tone({ type: 'sawtooth', f0: f, dur: 3.0, vol: 0.05, attack: 0.5, hold: 1.2, lp: 1500, detune: 9, when: i * 0.01 });
    });
    this.tone({ type: 'sine', f0: 1046.5, dur: 2.0, vol: 0.06, attack: 0.3 });
  },
  // continuous rumble loop with a level control
  rumble() {
    if (!this.ok) return { set() {}, stop() {} };
    const c = AudioSys.ctx;
    const src = c.createBufferSource(); src.buffer = AudioSys.noiseBuf; src.loop = true; src.playbackRate.value = 0.5;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 120;
    const osc = c.createOscillator(); osc.type = 'sine'; osc.frequency.value = 38;
    const og = c.createGain(); og.gain.value = 0.4;
    const g = c.createGain(); g.gain.value = 0.0001;
    src.connect(f); f.connect(g); osc.connect(og); og.connect(g); g.connect(AudioSys.sfxGain);
    src.start(); osc.start();
    return {
      set(v, secs) { const now = c.currentTime; g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(Math.max(0.0001, g.gain.value), now); g.gain.linearRampToValueAtTime(Math.max(0.0001, v), now + (secs || 0.3)); },
      stop(secs) { const now = c.currentTime; g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now); g.gain.linearRampToValueAtTime(0.0001, now + (secs || 0.5)); try { src.stop(now + (secs || 0.5) + 0.1); osc.stop(now + (secs || 0.5) + 0.1); } catch (e) { /* ignore */ } },
    };
  },
  crumble() { for (let i = 0; i < 3; i++) this.noise({ filter: 'lowpass', f0: rr(200, 600), dur: rr(0.1, 0.3), vol: 0.12, when: i * rr(0.05, 0.15) }); },
  type() { this.tone({ type: 'square', f0: 1700 + Math.random() * 300, dur: 0.025, vol: 0.05 }); this.noise({ filter: 'highpass', f0: 4000, dur: 0.02, vol: 0.05 }); },
  click() { this.tone({ type: 'sine', f0: 1250, f1: 900, dur: 0.06, vol: 0.12 }); },
  hover() { this.tone({ type: 'sine', f0: 900, dur: 0.035, vol: 0.04 }); },
  arp() { [262, 330, 392, 523, 659, 784, 1047, 1319].forEach((f, i) => this.tone({ type: 'square', f0: f, dur: 0.08, vol: 0.07, when: i * 0.07, shape: 'crush' })); },
  crunch() { this.noise({ filter: 'bandpass', f0: 1200, f1: 300, q: 0.7, dur: 0.6, vol: 0.3, shape: 'crush' }); },
  poof(p) { this.noise({ filter: 'bandpass', f0: 900, f1: 180, q: 0.8, dur: 0.35, vol: 0.3, dest: p || undefined }); this.tone({ type: 'sine', f0: 520, f1: 1100, dur: 0.1, vol: 0.12, dest: p || undefined }); },
  bonus() { this.tone({ type: 'square', f0: 988, dur: 0.07, vol: 0.07 }); this.tone({ type: 'square', f0: 1319, dur: 0.12, vol: 0.07, when: 0.07 }); },
  gold() { [1047, 1319, 1568].forEach((f, i) => this.tone({ type: 'triangle', f0: f, dur: 0.18, vol: 0.09, when: i * 0.05 })); },
  portal() { this.tone({ type: 'sine', f0: 220, f1: 1760, dur: 1.2, vol: 0.2, attack: 0.3 }); this.noise({ filter: 'highpass', f0: 1500, f1: 6000, dur: 1.2, vol: 0.12, attack: 0.4 }); },
};
function setPannerPos(p, x, y, z) {
  if (!p) return;
  if (p.positionX) { p.positionX.value = x; p.positionY.value = y; p.positionZ.value = z; } else if (p.setPosition) p.setPosition(x, y, z);
}

// =====================================================================================
// RENDER / XR — renderer, scene, camera rig, controllers, gloves, session events
// =====================================================================================
let renderer, scene, camera, rig, hemi, dirLight;
const G = {};                // top-level groups: lobby, maze, mazeDeco, chamber, fx, hud, stage
const LAYER_AVATAR = 3;      // mirror-only avatar (XR eye cameras render layers 0+1 / 0+2)

const Rig = {
  yaw: 0, pitch: 0,
  headWorld(out) { return camera.getWorldPosition(out); },
  // yaw of the gaze direction projected on the floor
  headYaw() {
    camera.getWorldDirection(_v8);
    return Math.atan2(-_v8.x, -_v8.z);
  },
  headForward(out) { // horizontal unit forward
    camera.getWorldDirection(out); out.y = 0;
    if (out.lengthSq() < 1e-6) out.set(-Math.sin(this.yaw), 0, -Math.cos(this.yaw));
    return out.normalize();
  },
  // rotate the rig around the head so the head stays put
  turn(delta) {
    rig.updateMatrixWorld(true);
    camera.getWorldPosition(_v7);
    const bx = _v7.x, bz = _v7.z;
    this.yaw = wrapAngle(this.yaw + delta);
    rig.rotation.set(0, this.yaw, 0);
    rig.updateMatrixWorld(true);
    camera.getWorldPosition(_v7);
    rig.position.x += bx - _v7.x; rig.position.z += bz - _v7.z;
    rig.updateMatrixWorld(true);
  },
  setYaw(y) { this.turn(wrapAngle(y - this.yaw)); },
  // head offset from the rig origin in world space (XZ)
  headOffset(out) {
    out.copy(camera.position); out.y = 0;
    out.applyAxisAngle(UP, this.yaw);
    return out;
  },
  seatedOffset() { return (XR.inVR && Save.s.seated) ? CONFIG.SEATED_OFFSET : 0; },
  // place the rig so the head is over (x,z) and the floor is at y
  placeFeet(x, y, z) {
    this.headOffset(_v7);
    rig.position.set(x - _v7.x, y + this.seatedOffset(), z - _v7.z);
    rig.updateMatrixWorld(true);
  },
  eyeHeight() { return XR.inVR ? Math.max(CONFIG.MIN_HEIGHT, camera.position.y + this.seatedOffset()) : CONFIG.DESKTOP_EYE; },
};

function initRenderer() {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');
  renderer.xr.setFramebufferScaleFactor(1.0);
  renderer.xr.setFoveation(1);
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(CONFIG.COLORS.void);
  scene.fog = new THREE.FogExp2(CONFIG.COLORS.fog1, 0.018);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 700);
  camera.rotation.order = 'YXZ';
  camera.position.set(0, CONFIG.DESKTOP_EYE, 0);
  rig = new THREE.Group();
  rig.add(camera);
  scene.add(rig);

  // Lights: count never changes (avoids shader recompiles). 3 pooled point lights max.
  hemi = new THREE.HemisphereLight(CONFIG.COLORS.hemiSky1, 0x000000, 0.6 * CONFIG.LIGHT_SCALE);
  scene.add(hemi);
  dirLight = new THREE.DirectionalLight(0xb8a0ff, 0.35 * CONFIG.LIGHT_SCALE);
  dirLight.position.set(0.4, 1, 0.3);
  scene.add(dirLight);
  Lights.init();

  for (const k of ['lobby', 'maze', 'mazeDeco', 'chamber', 'fx', 'hud', 'stage']) { G[k] = new THREE.Group(); G[k].name = k; scene.add(G[k]); }
  G.maze.visible = false; G.mazeDeco.visible = false; G.chamber.visible = false; G.stage.visible = false;

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// pooled dynamic point lights (max 3 active)
const Lights = {
  pool: [],
  init() {
    for (let i = 0; i < 3; i++) {
      const l = new THREE.PointLight(0xffffff, 0, 8, 2);
      l.userData.owner = null;
      scene.add(l); this.pool.push(l);
    }
  },
  acquire(owner, color, intensity, distance) {
    let l = this.pool.find((x) => x.userData.owner === owner) || this.pool.find((x) => !x.userData.owner);
    if (!l) return null;
    l.userData.owner = owner; l.color.set(color); l.intensity = intensity; l.distance = distance || 8;
    return l;
  },
  release(owner) { for (const l of this.pool) if (l.userData.owner === owner) { l.userData.owner = null; l.intensity = 0; } },
  releaseAll() { for (const l of this.pool) { l.userData.owner = null; l.intensity = 0; } },
  tint(color) { for (const l of this.pool) if (l.userData.owner) l.color.set(color); },
};

// ---------------- WebXR session ----------------
const XR = {
  supported: false, inVR: false, session: null,
  async check() {

// ---------------- controllers, gloves, laser pointers ----------------
const Hands = {
  list: [],
  get(hand) { return this.list.find((h) => h.hand === hand && h.source) || null; },
  init() {
    const factory = new XRControllerModelFactory();
    const gloveMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
    const cuffMat = new THREE.MeshLambertMaterial({ color: 0x5a5a60 });
    const laserMat = new THREE.MeshBasicMaterial({ color: 0xd9a6ff, transparent: true, opacity: 0.75, depthWrite: false });
    const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false });
    for (let i = 0; i < 2; i++) {
      const ray = renderer.xr.getController(i);
      const grip = renderer.xr.getControllerGrip(i);
      const h = { index: i, ray, grip, source: null, hand: 'none', glove: null, laser: null, dot: null, hover: null, wasGrip: false, worldPos: new THREE.Vector3() };
      ray.addEventListener('connected', (e) => { h.source = e.data; h.hand = e.data.handedness || 'none'; h.glove.scale.x = h.hand === 'left' ? -1 : 1; });
      ray.addEventListener('disconnected', () => { h.source = null; h.hand = 'none'; });
      ray.addEventListener('selectstart', () => { AudioSys.ensure(); UI.select(h); });
      grip.add(factory.createControllerModel(grip));
      h.glove = makeGlove(gloveMat, cuffMat);
      grip.add(h.glove);
      // laser: thin box along -Z, scaled to hit distance
      const lg = new THREE.BoxGeometry(0.004, 0.004, 1); lg.translate(0, 0, -0.5);
      h.laser = new THREE.Mesh(lg, laserMat); h.laser.visible = false; h.laser.renderOrder = 5000;
      ray.add(h.laser);
      h.dot = new THREE.Mesh(new THREE.SphereGeometry(0.012, 8, 6), dotMat); h.dot.visible = false; h.dot.renderOrder = 5001;
      scene.add(h.dot);
      rig.add(ray); rig.add(grip);
      this.list.push(h);
    }
  },
  // world position of a hand (grip) — returns null if not tracked
  pos(hand) { const h = this.get(hand); if (!h) return null; h.grip.getWorldPosition(h.worldPos); return h.worldPos; },
  pulse(hand, intensity, ms) {
    const list = hand === 'both' ? this.list : [this.get(hand)];
    for (const h of list) {
      if (!h || !h.source || !h.source.gamepad) continue;
      const act = h.source.gamepad.hapticActuators && h.source.gamepad.hapticActuators[0];
      try { if (act && act.pulse) act.pulse(intensity, ms); else if (h.source.gamepad.vibrationActuator) h.source.gamepad.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: intensity, weakMagnitude: intensity }); } catch (e) { /* ignore */ }
    }
  },
  blink(on) { for (const h of this.list) h.glove.visible = on; },
};

function makeGlove(mat, cuffMat) {
  const parts = [];
  const palm = new THREE.BoxGeometry(0.075, 0.028, 0.09); palm.translate(0, -0.005, 0.03); parts.push(palm);
  for (let f = 0; f < 4; f++) {
    const g = new THREE.CapsuleGeometry(0.0095, 0.05, 3, 6); g.rotateX(Math.PI / 2 - 0.5); g.translate(-0.027 + f * 0.018, -0.03, -0.035); parts.push(g);
  }
  const thumb = new THREE.CapsuleGeometry(0.011, 0.04, 3, 6); thumb.rotateZ(1.0); thumb.rotateX(0.6); thumb.translate(0.045, 0.0, 0.0); parts.push(thumb);
  const glove = new THREE.Mesh(mergeGeometries(parts), mat);
  parts.forEach((p) => p.dispose());

  cuff.rotation.x = Math.PI / 2; cuff.position.set(0, -0.005, 0.095);
  glove.add(cuff);

}

// INPUT — XR gamepads + desktop keyboard/mouse unified into one per-frame state
// =====================================================================================
const Input = {
  move: new THREE.Vector2(), moveMag: 0, turnX: 0,
  jumpPressed: false, jumpHeld: false, sprintToggle: false, pausePressed: false, recenter: false,
  grabPressed: false, gripHeld: { left: false, right: false }, gripPressed: { left: false, right: false }, gripReleased: { left: false, right: false },
  keys: Object.create(null), keysPressed: Object.create(null),
  mouseDX: 0, mouseDY: 0, dragging: false, lastMouse: { x: 0, y: 0 }, mouseNDC: new THREE.Vector2(),
  prev: new Map(), pauseHold: 0, pauseConsumed: false, snapCooldown: 0,
  locked: false,
  initDesktop() {
    const el = renderer.domElement;
    window.addEventListener('keydown', (e) => {
      if (!this.keys[e.code]) this.keysPressed[e.code] = true;
      this.keys[e.code] = true;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => { this.keys = Object.create(null); });
    el.addEventListener('mousedown', (e) => {
      AudioSys.ensure();
      if (XR.inVR) return;
      if (this.locked) { UI.desktopClick(null); return; }
      // unlocked: click UI under the mouse, otherwise grab pointer lock / start drag-look
      this.mouseNDC.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
      if (UI.desktopClick(this.mouseNDC)) return;
      this.dragging = true; this.lastMouse.x = e.clientX; this.lastMouse.y = e.clientY;
      if (el.requestPointerLock) { try { const p = el.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (err) { /* ignore */ } }
    });
    window.addEventListener('mouseup', () => { this.dragging = false; });
    window.addEventListener('mousemove', (e) => {
      if (this.locked) { this.mouseDX += e.movementX || 0; this.mouseDY += e.movementY || 0; }
      else if (this.dragging) { this.mouseDX += e.clientX - this.lastMouse.x; this.mouseDY += e.clientY - this.lastMouse.y; this.lastMouse.x = e.clientX; this.lastMouse.y = e.clientY; }
      this.mouseNDC.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
    });
    document.addEventListener('pointerlockchange', () => {
      this.locked = document.pointerLockElement === el;
      DOM.crosshair.style.display = this.locked ? 'block' : 'none';
      if (this.locked) DOM.overlay.classList.add('hidden');
      // Esc releases pointer lock (browsers swallow the key) => treat as pause
      if (!this.locked && !XR.inVR && SM.isGameplay()) SM.pause();
    });
  },
  btn(h, i) { const b = h.source && h.source.gamepad && h.source.gamepad.buttons[i]; return !!(b && b.pressed); },
  edge(key, now) { const was = this.prev.get(key) || false; this.prev.set(key, now); return now && !was; },
  poll(dt) {
    this.move.set(0, 0); this.turnX = 0;
    this.jumpPressed = false; this.sprintToggle = false; this.pausePressed = false; this.recenter = false; this.grabPressed = false;
    let jumpHeld = false;
    for (const hand of ['left', 'right']) { this.gripPressed[hand] = false; this.gripReleased[hand] = false; }
    this.snapCooldown = Math.max(0, this.snapCooldown - dt);

    if (XR.inVR) {
      const moveHand = Save.s.swap ? 'right' : 'left', turnHand = Save.s.swap ? 'left' : 'right';
      let pauseDown = false;
      for (const h of Hands.list) {
        if (!h.source || !h.source.gamepad) continue;
        const gp = h.source.gamepad, ax = gp.axes;
        const sx = ax.length >= 4 ? ax[2] : (ax[0] || 0), sy = ax.length >= 4 ? ax[3] : (ax[1] || 0);
        if (h.hand === moveHand) {
          this.move.set(sx, -sy);
          if (this.edge(h.hand + '3', this.btn(h, 3))) this.sprintToggle = true;
        }
        if (h.hand === turnHand) this.turnX = Math.abs(sx) > 0.15 ? sx : 0;
        const jumpBtn = this.btn(h, 4);
        if (this.edge(h.hand + '4', jumpBtn)) this.jumpPressed = true;
        if (jumpBtn) jumpHeld = true;
        if (this.btn(h, 5)) pauseDown = true;
        const grip = this.btn(h, 1);
        if (grip && !this.gripHeld[h.hand]) this.gripPressed[h.hand] = true;
        if (!grip && this.gripHeld[h.hand]) this.gripReleased[h.hand] = true;
        this.gripHeld[h.hand] = grip;
      }
      // B / Y: short press = pause, long press (1 s) = recentre
      if (pauseDown) {
        this.pauseHold += dt;
        if (this.pauseHold >= 1.0 && !this.pauseConsumed) { this.recenter = true; this.pauseConsumed = true; }
      } else {
        if (this.pauseHold > 0 && !this.pauseConsumed) this.pausePressed = true;
        this.pauseHold = 0; this.pauseConsumed = false;
      }
      const m = this.move.length();
      if (m < 0.15) this.move.set(0, 0); else if (m > 1) this.move.divideScalar(m);
    } else {
      const k = this.keys;
      if (k.KeyW || k.ArrowUp) this.move.y += 1;
      if (k.KeyS || k.ArrowDown) this.move.y -= 1;
      if (k.KeyD || k.ArrowRight) this.move.x += 1;
      if (k.KeyA || k.ArrowLeft) this.move.x -= 1;
      if (this.move.lengthSq() > 1) this.move.normalize();
      if (this.keysPressed.Space) this.jumpPressed = true;
      jumpHeld = !!k.Space;
      if (this.keysPressed.KeyE) { this.grabPressed = true; }
      if (this.keysPressed.ShiftLeft || this.keysPressed.ShiftRight) this.sprintToggle = true;
      if (this.keysPressed.KeyP || (this.keysPressed.Escape && !this.locked)) this.pausePressed = true;
      if (this.keysPressed.KeyM) AudioSys.toggleMute();
      if (this.keysPressed.KeyR && SM.isGameplay()) this.recenter = true;
      // mouse look
      const sens = 0.0022;
      if (this.mouseDX || this.mouseDY) {
        Rig.yaw = wrapAngle(Rig.yaw - this.mouseDX * sens);
        Rig.pitch = clamp(Rig.pitch - this.mouseDY * sens, -1.45, 1.45);
        rig.rotation.y = Rig.yaw; camera.rotation.x = Rig.pitch;
      }
      if (DEBUG_URL) {
        const map = { Digit1: 'LAP1', Digit2: 'LAP2', Digit3: 'IDOL', Digit4: 'ESCAPE', Digit5: 'WIN' };
        for (const code in map) if (this.keysPressed[code]) Debug.jump(map[code]);
      }
    }
    this.mouseDX = 0; this.mouseDY = 0;
    this.moveMag = this.move.length();
    this.jumpHeld = jumpHeld;
    this.keysPressed = Object.create(null);
  },
};

// TEXTURES — every image is drawn on <canvas> at startup and cached
// =====================================================================================
const TEX = {};
const CANVAS = {};
const FONT_MONO = '"Courier New", ui-monospace, monospace';
const FONT_IMPACT = 'Impact, "Arial Black", "Helvetica Neue", sans-serif';

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function canvasTex(c, o = {}) {

function roundedRect(ctx, x, y, w, h, r) {

// Text with outline and optional manual letter spacing (em units)
function drawText(ctx, text, x, y, o = {}) {
  const size = o.size || 32;
  ctx.font = (o.style || 'bold') + ' ' + size + 'px ' + (o.font || FONT_MONO);
  ctx.textBaseline = o.baseline || 'middle';
  const spacing = (o.spacing || 0) * size;
  const chars = Array.from(text);
  let total = 0; const widths = chars.map((ch) => { const w = ctx.measureText(ch).width; total += w; return w; });
  total += spacing * Math.max(0, chars.length - 1);
  let scale = 1;

  ctx.save();
  ctx.translate(x, y);
  if (o.skew) ctx.transform(1, 0, -o.skew, 1, 0, 0);

function buildDoodleStrokes() {

    }

    let len = 0; for (let i = 1; i < out.length; i++) len += Math.hypot(out[i][0] - out[i - 1][0], out[i][1] - out[i - 1][1]);

  jit(arc(470, 335, 250, 215, Math.PI, Math.PI * 2));                                      // cap dome
  jit([[180, 345], [330, 320], [520, 318], [720, 330], [800, 352], [700, 368], [470, 360], [220, 372], [180, 345]]); // brim
  jit([[300, 228], [318, 298], [342, 250], [366, 298], [384, 228]]);                      // W
  jit([[452, 228], [412, 228], [412, 298], [454, 298]]); jit([[412, 262], [446, 262]]);   // E
  jit([[540, 236], [512, 226], [488, 246], [488, 282], [510, 300], [538, 292], [540, 268], [520, 268]]); // G
  jit([[562, 300], [584, 226], [606, 300]]); jit([[570, 274], [598, 274]]);               // A
  jit([[636, 226], [632, 280]]); jit([[631, 296], [633, 300]]);                           // !
  jit(arc(470, 520, 215, 210, -0.15, Math.PI + 0.15, 50));                                 // face
  jit(arc(400, 455, 40, 44, 0, Math.PI * 2, 24)); jit(arc(545, 455, 40, 44, 0, Math.PI * 2, 24)); // eyes
  jit(arc(410, 465, 9, 9, 0, Math.PI * 2, 10)); jit(arc(533, 462, 9, 9, 0, Math.PI * 2, 10));    // pupils
  jit(arc(472, 545, 50, 42, 0, Math.PI * 2, 28));                                          // fat nose
  // bushy mustache (scallops)
  const must = []; for (let i = 0; i <= 8; i++) { const x = 330 + i * 35; must.push([x, 598 + (i % 2) * 26]); }
  jit(must);
  jit([[330, 598], [400, 580], [472, 590], [545, 580], [610, 598]]);
  // big open grin
  jit([[370, 640], [580, 640]]);
  jit(arc(475, 640, 105, 85, 0, Math.PI, 30));
  jit([[400, 640], [405, 668]]); jit([[440, 640], [442, 672]]); jit([[510, 640], [508, 672]]); jit([[550, 640], [546, 668]]);
  // round body
  jit(arc(470, 900, 190, 160, Math.PI * 1.05, Math.PI * 1.95, 40));
  // arm + thumbs-up hand
  jit([[640, 790], [700, 740], [740, 700]]);
  jit([[740, 660], [840, 660], [860, 690], [850, 745], [745, 745], [735, 700], [740, 660]]);
  jit([[760, 660], [752, 600], [758, 560], [785, 552], [800, 575], [795, 660]]);
  jit([[750, 690], [845, 690]]); jit([[748, 717], [848, 717]]);
  jit([[830, 560], [860, 530]]); jit([[850, 600], [895, 590]]); jit([[810, 525], [818, 485]]);

}
function drawDoodle(ctx, size, progress, data) {
  ctx.clearRect(0, 0, size, size);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, size, size);
  ctx.save(); ctx.scale(size / 1000, size / 1000);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = '#b84dff'; ctx.lineWidth = 7;
  ctx.shadowColor = '#8a00ff'; ctx.shadowBlur = 18;
  let remaining = progress * data.total;
  for (const s of data.strokes) {
    if (remaining <= 0) break;
    ctx.beginPath(); ctx.moveTo(s.pts[0][0], s.pts[0][1]);
    for (let i = 1; i < s.pts.length; i++) {
      const [x0, y0] = s.pts[i - 1], [x1, y1] = s.pts[i];
      const seg = Math.hypot(x1 - x0, y1 - y0);
      if (remaining >= seg) { ctx.lineTo(x1, y1); remaining -= seg; }
      else { const t = remaining / seg; ctx.lineTo(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t); remaining = 0; break; }
    }
    ctx.stroke(); ctx.stroke();
  }
  ctx.restore();
}

    for (const { p, g } of lat) {
      const fx = x / N * p, fy = y / N * p, ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy;

class Follower {

const VIGNETTE_VS = `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const VIGNETTE_FS = `

varying vec3 vDir;
void main(){
  float c = -vDir.z;
  float a = (1.0 - smoothstep(uInner - uSoft, uInner, c)) * uStrength;

varying vec3 vDir;

// LEVEL — colliders + spatial hash, maze graph & meshes, lap skins, lobby, sky, beacon
// =====================================================================================
const World = {
  colliders: [], grid: new Map(), stamp: 1, CELL: 8, out: [],

  clear() { this.colliders.length = 0; this.grid.clear(); },
  insert(c) {
    c.active = true; c.stamp = 0;
    const C = this.CELL;
    const x0 = Math.floor(c.minX / C), x1 = Math.floor(c.maxX / C), z0 = Math.floor(c.minZ / C), z1 = Math.floor(c.maxZ / C);
    for (let ix = x0; ix <= x1; ix++) for (let iz = z0; iz <= z1; iz++) {

  },
  addBox(minX, minY, minZ, maxX, maxY, maxZ, tag) { return this.insert({ kind: 0, minX, minY, minZ, maxX, maxY, maxZ, tag }); },
  // ramp: top height goes linearly y0 -> y1 along axis (0 = x, 1 = z) from min to max
  addRamp(minX, minZ, maxX, maxZ, axis, y0, y1, tag) {
    return this.insert({ kind: 1, minX, minZ, maxX, maxZ, axis, y0, y1, minY: Math.min(y0, y1) - 1, maxY: Math.max(y0, y1), tag });
  },
  query(minX, minZ, maxX, maxZ) {

    const x0 = Math.floor(minX / C), x1 = Math.floor(maxX / C), z0 = Math.floor(minZ / C), z1 = Math.floor(maxZ / C);
    for (let ix = x0; ix <= x1; ix++) for (let iz = z0; iz <= z1; iz++) {
      const arr = this.grid.get(this.key(ix, iz)); if (!arr) continue;
      for (let i = 0; i < arr.length; i++) {

  },
  topAt(c, x, z) {

      const t = this.topAt(c, x, z);

    }

  },

    const col = new Float32Array(n * 3);

      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;

// ---------------- maze graph generation ----------------
function edgeKey(a, b) { return a < b ? a * 1000 + b : b * 1000 + a; }

    e.id = i;

    const cost = Math.hypot(A.x - B.x, A.y - B.y, A.z - B.z);

    const nv = noise(i * 0.42 + 0.3, j * 0.42 + 0.7) * 0.75 + noise(i * 1.13 + 5, j * 1.13 + 9) * 0.25;
    nodes.push({ id: j * N + i, i, j, x: (i - (N - 1) / 2) * S, z: (j - (N - 1) / 2) * S, nv, tier: 0, y: 0, adj: [] });

  for (const n of nodes) n.tier = n.nv < q1 ? 0 : n.nv < q2 ? 1 : 2;

  const add = (a, b, kind) => { const k = edgeKey(a, b); if (set.has(k)) return; set.add(k); edges.push({ a, b, kind }); };

    for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {

      if (ni >= 0 && nj >= 0 && ni < N && nj < N && !visited[idx(ni, nj)]) nb.push(idx(ni, nj));

    if (!nb.length) { stack.pop(); continue; }

    if (j < N - 1 && !set.has(edgeKey(idx(i, j), idx(i, j + 1)))) cand.push([idx(i, j), idx(i, j + 1)]);

  let edges = g1.edges.map((e) => ({ a: e.a, b: e.b, kind: e.kind }));
  const target = Math.round(edges.length * CONFIG.LAP2_REMOVE_FRAC);
  const order = shuffle(edges.map((_, i) => i), rng), removed = new Set();
  for (const i of order) {

    if (j < N - 1 && !had.has(edgeKey(a, a + N))) cand.push([a, a + N]);

  g: null, segs: [], gScore: null, fScore: null, came: null, closed: null, open: [], path: [],
  set(g, segs) {

      const cur = open[bi]; open[bi] = open[open.length - 1]; open.pop();

let ENV_MAP = null;
// tiny procedural environment for the golden idol (built once at startup, before any XR session)
function buildEnvMap() {
  const envScene = new THREE.Scene();
  const geo = new THREE.SphereGeometry(10, 32, 16), col = new Float32Array(geo.attributes.position.count * 3);
  for (let i = 0; i < geo.attributes.position.count; i++) {
    const y = geo.attributes.position.getY(i) / 10;
    _c1.setRGB(0.05, 0.03, 0.08).lerp(_c2.setRGB(1.0, 0.8, 0.45), clamp(y * 0.8 + 0.45, 0, 1));
    if (y > 0.7) _c1.lerp(_c2.setRGB(1.6, 1.5, 1.3), (y - 0.7) / 0.3);
    col[i * 3] = _c1.r; col[i * 3 + 1] = _c1.g; col[i * 3 + 2] = _c1.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  envScene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  for (let i = 0; i < 5; i++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.4, 1.5), new THREE.MeshBasicMaterial({ color: new THREE.Color(3, 2.6, 2) }));
    b.position.set(Math.cos(i * 1.3) * 7, 3 + i, Math.sin(i * 1.3) * 7); envScene.add(b);
  }
  const pm = new THREE.PMREMGenerator(renderer);
  ENV_MAP = pm.fromScene(envScene, 0.02).texture;
  pm.dispose();
  envScene.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
}

// Every walkable piece is a "chunk" (instance in one InstancedMesh) with an arc-length s so the

class RouteBuilder {

  right() { return _v8.set(-this.h.z, 0, this.h.x); }
  rotY() { return Math.atan2(this.h.x, this.h.z); }
  pushPoly() { this.poly.push({ x: this.p.x, y: this.p.y, z: this.p.z, s: this.s }); }

// deterministic placement of exactly 207 collectibles along the current maze (rows of 3-7, 1.7 m apart)
function placeCollectibles(g, seed) {
  const rng = mulberry32(seed), total = CONFIG.COLLECT_TOTAL, sp = CONFIG.COLLECT_SPACING, hov = CONFIG.COLLECT_HOVER;
  const out = [];
  // clusters on node platforms
  const nodeIds = shuffle(g.nodes.map((n) => n.id).filter((id) => id !== g.start), rng).slice(0, 6);
  for (const id of nodeIds) {
    const n = g.nodes[id], k = rint(rng, 3, 4), a0 = rng() * 6.28;
    for (let i = 0; i < k; i++) { const a = a0 + i / k * Math.PI * 2; out.push(new THREE.Vector3(n.x + Math.cos(a) * 1.15, n.y + hov, n.z + Math.sin(a) * 1.15)); }
  }
  // rows along walkways and stairs, length proportional to walkway length
  const edges = shuffle(g.edges.slice(), rng);
  for (const e of edges) {
    if (out.length >= total) break;
    const I = e.info, L = I.len3;
    const cap = Math.min(7, Math.floor((L - 1.2) / sp) + 1);
    if (cap < 3) continue;
    let n = clamp(cap - rint(rng, 0, 1), 3, 7);
    n = Math.min(n, total - out.length);
    for (let i = 0; i < n; i++) {
      const t = 0.5 + ((i - (n - 1) / 2) * sp) / L;
      edgePoint(I, t, _v1); _v1.y += hov;
      out.push(_v1.clone());
    }
  }
  // fallback (guarantees the exact count): offset rows on already-used walkways
  let k = 0;
  while (out.length < total && k < edges.length * 4) {
    const e = edges[k % edges.length], I = e.info, side = (Math.floor(k / edges.length) % 2 ? 1 : -1) * 0.75;
    edgePoint(I, 0.5 + (rng() - 0.5) * 0.6, _v1); _v1.y += hov;
    if (I.axis === 0) _v1.z += side; else _v1.x += side;
    out.push(_v1.clone()); k++;
  }
  out.length = Math.min(out.length, total);
  if (out.length !== total) console.warn('[Wega] collectible count mismatch', out.length);
  return out;
}

      if (k >= 1) { this.state = 'linger'; this.t = 0; }
    }
    if (this.state === 'linger' && this.t >= 1.0) { this.state = 'wait'; this.cycle = Math.max(0.3, CONFIG.GLITCH_PERIOD / diff().threat - 2.35); this.group.visible = false; return; }
    // chromatic-aberration jitter

// ---------------- Wega Glitch Head (Lap 2 scare) ----------------
const WEGAHEAD_FS = `
uniform sampler2D uMap; uniform float uTime; uniform float uOpacity;
varying vec2 vUv;
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main(){
  vec2 uv = vUv;
  float slice = floor(uv.y * 26.0);
  float n = hash(vec2(slice, floor(uTime * 14.0)));
  uv.x += (n > 0.72 ? (n - 0.72) * 0.55 : 0.0) * sin(uTime * 33.0 + slice);
  float off = 0.012 + 0.012 * sin(uTime * 7.0);
  vec4 cr = texture2D(uMap, uv + vec2(off, 0.0));
  vec4 cg = texture2D(uMap, uv);
  vec4 cb = texture2D(uMap, uv - vec2(off, 0.0));
  float a = max(max(cr.a, cg.a), cb.a);
  vec3 col = vec3(cr.r, cg.g, cb.b);
  col *= 0.8 + 0.2 * sin(vUv.y * 500.0 + uTime * 30.0);
  if (a * uOpacity < 0.02) discard;
  gl_FragColor = vec4(col, a * uOpacity);
}`;
const WegaHead = {
  mesh: null, uni: null, active: false, t: 0, hitDone: false,
  init() {
    this.uni = { uMap: { value: TEX.wega }, uTime: { value: 0 }, uOpacity: { value: 0 } };
    this.mesh = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.ShaderMaterial({
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: WEGAHEAD_FS, uniforms: this.uni, transparent: true, depthWrite: false, side: THREE.DoubleSide,
    }));
    this.mesh.visible = false; this.mesh.renderOrder = 10; G.fx.add(this.mesh);
  },
  spawn() {
    const p = Player.pos;
    let axis = Nav.walkAxisAt(p);
    if (!axis) { Rig.headForward(_v4); axis = _v4; }
    const side = Math.random() < 0.5 ? -1 : 1;
    _v1.set(-axis.z, 0, axis.x).multiplyScalar(side * 4.6);
    Rig.headForward(_v2);
    this.mesh.position.set(p.x + _v1.x + _v2.x * 3, p.y + 2.6, p.z + _v1.z + _v2.z * 3);
    this.active = true; this.t = 0; this.hitDone = false; this.mesh.visible = true;
    Music.warble();
    Sfx.laugh(Sfx.panner(this.mesh.position.x, this.mesh.position.y, this.mesh.position.z, 3));
    Captions.show('[ WEGA LAUGHS ]', 2.0);
    Hands.pulse('both', 0.4, 200);
  },
  stop() { this.active = false; this.mesh.visible = false; },
  update(dt) {
    if (!this.active) return;
    this.t += dt; this.uni.uTime.value += dt;
    const L = CONFIG.WEGAHEAD_LIFE;
    this.uni.uOpacity.value = this.t < 0.3 ? this.t / 0.3 : this.t > L - 0.6 ? Math.max(0, (L - this.t) / 0.6) : 1;
    camera.getWorldPosition(_v1);
    this.mesh.lookAt(_v1.x, this.mesh.position.y, _v1.z);
    if (!this.hitDone && Player.capsuleDist(this.mesh.position) < 2.6) { this.hitDone = true; Player.damage(CONFIG.DMG.wegaHead, 'wegaHead'); }
    if (this.t >= L) this.stop();

// ---------------- Pixel Flood (Lap 2 at 120 and 25 LEFT) ----------------
const Flood = {
  mesh: null, samples: null, count: 0, active: false, cx: 0, cz: 0, R: 0, maxR: 0, hitDone: false, whooshDone: false, MAX: 600,
  init() {
    const geo = new THREE.BoxGeometry(CONFIG.FLOOD_BLOCK, CONFIG.FLOOD_HEIGHT, CONFIG.FLOOD_BLOCK);
    this.mesh = new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial({ color: 0xffffff }), this.MAX);
    for (let i = 0; i < this.MAX; i++) this.mesh.setColorAt(i, _c1.set(i % 3 ? 0xffe600 : 0xc8b400));
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.count = 0; this.mesh.frustumCulled = false; this.mesh.visible = false;
    G.fx.add(this.mesh);
  },
  // sample every walkable top surface on a 0.8 m grid (done once per Lap 2 build)
  prepare() {
    const pts = [], S = CONFIG.FLOOD_BLOCK;
    for (const c of World.colliders) {
      for (let x = c.minX + S / 2; x < c.maxX; x += S) for (let z = c.minZ + S / 2; z < c.maxZ; z += S) pts.push(x, World.topAt(c, x, z), z);
    }
    this.samples = new Float32Array(pts); this.count = pts.length / 3;
  },
  start() {
    if (!this.samples) this.prepare();
    const a = Math.random() * Math.PI * 2;
    this.cx = Math.cos(a) * 85; this.cz = Math.sin(a) * 85;
    let minD = Infinity, maxD = 0;
    for (let i = 0; i < this.count; i++) { const d = Math.hypot(this.samples[i * 3] - this.cx, this.samples[i * 3 + 2] - this.cz); if (d < minD) minD = d; if (d > maxD) maxD = d; }
    this.R = minD - 2; this.maxR = maxD + 2; this.active = true; this.hitDone = false; this.whooshDone = false;
    this.mesh.visible = true;
    UI.announce('PIXEL FLOOD!', { color: '#ffe600' });
    Sfx.arp();
    Captions.show('[ 8-BIT RUMBLE ]', 1.5);
  },
  stop() { this.active = false; this.mesh.visible = false; this.mesh.count = 0; },
  update(dt) {
    if (!this.active) return;
    this.R += CONFIG.FLOOD_SPEED * dt;
    let n = 0;
    const half = CONFIG.FLOOD_BLOCK * 0.55, t = Clock.real;
    for (let i = 0; i < this.count && n < this.MAX; i++) {
      const x = this.samples[i * 3], y = this.samples[i * 3 + 1], z = this.samples[i * 3 + 2];
      const d = Math.hypot(x - this.cx, z - this.cz);
      if (Math.abs(d - this.R) < half) {
        const jig = ((i * 7919) % 5) * 0.03 + Math.sin(t * 20 + i) * 0.04;
        _m1.makeTranslation(x, y + CONFIG.FLOOD_HEIGHT / 2 + jig, z);
        this.mesh.setMatrixAt(n++, _m1);
      }
    }
    this.mesh.count = n; this.mesh.instanceMatrix.needsUpdate = true;
    const p = Player.pos, dp = Math.hypot(p.x - this.cx, p.z - this.cz), gap = Math.abs(dp - this.R);
    if (!this.whooshDone && dp - this.R < 9 && dp > this.R) { this.whooshDone = true; Sfx.crunch(); }
    if (!this.hitDone && gap < half + CONFIG.RADIUS) {
      const g = Player.probeGround(p.x, p.z, p.y + 0.4);
      if (g > -Infinity && p.y < g + CONFIG.FLOOD_HEIGHT) {
        this.hitDone = true;
        if (Player.damage(CONFIG.DMG.flood, 'flood')) { Effects.doFlash(0xffe600, 0.6, true); FX.pixels(p.x, p.y, p.z); Sfx.crunch(); }
      }
    }
    if (this.R > this.maxR) this.stop();
  },
};

// ---------------- the threat director ----------------
const Hazards = {
  mode: 'off', lasers: [], fireballs: [], roryT: 0, scrT: 0, laserT: [], fireT: 0, headTimes: [], floodsDone: null, esc: null,
  init() {
    Rory.init(); Screamer.init(); GlitchGuy.init(); WegaHead.init(); Flood.init();
    for (let i = 0; i < 7; i++) this.lasers.push(new Laser());
    for (let i = 0; i < 5; i++) this.fireballs.push(new Fireball());
  },
  clear() {
    Rory.despawn(false); Screamer.clear(); GlitchGuy.stop(); WegaHead.stop(); Flood.stop();
    for (const l of this.lasers) l.stop();
    for (const f of this.fireballs) f.stop();
    Decals.clear(); FX.clear(); Lights.releaseAll();
    this.mode = 'off';
  },
  reset(mode) {
    this.clear();
    this.mode = mode;
    const tr = diff().threat;
    if (mode === 'lap1') {
      this.roryT = CONFIG.RORY_FIRST / Math.max(0.6, tr);
      this.scrT = rr(...CONFIG.SCREAMER_CD) / tr;
      this.laserT = this.lasers.map((_, i) => 2 + i * 6);
    } else if (mode === 'lap2') {
      this.roryT = 12 / tr;
      this.scrT = rr(4, 8) / tr;
      this.laserT = this.lasers.map((_, i) => 1 + i * 3.5);
      this.fireT = 5;
      GlitchGuy.reset(10 / tr);
      const T = Lap2.timeMax; this.headTimes = [T * 0.8, T * 0.5, T * 0.22].slice(0, CONFIG.WEGAHEAD_COUNT);
      this.floodsDone = new Set();
    } else if (mode === 'escape') {
      this.setupEscape();
    }
  },
  roryGap(lap2) { const g = lap2 ? CONFIG.RORY_GAP2 : CONFIG.RORY_GAP; return rr(g[0], g[1]) / diff().threat; },
  roryEventSpeed(lap2) { return (lap2 ? CONFIG.RORY_SPEED2 : CONFIG.RORY_SPEED) + diff().roryBonus; },
  makeLaserCfg(lap2) {
    const p = Player.pos, color = lap2 ? CONFIG.COLORS.laser2 : CONFIG.COLORS.laser;
    if (Math.random() < 0.55) {
      // searchlight beam from high in the sky, sweeping across the maze near the player
      const a = Math.random() * Math.PI * 2;
      const anchor = new THREE.Vector3(p.x + Math.cos(a) * 45, 75, p.z + Math.sin(a) * 45);
      const b = a + Math.PI / 2 + rr(-0.4, 0.4), L = rr(25, 40);
      const mid = new THREE.Vector3(p.x + rr(-6, 6), -14, p.z + rr(-6, 6));
      const p0 = mid.clone().add(new THREE.Vector3(Math.cos(b) * L, 0, Math.sin(b) * L)), p1 = mid.clone().sub(new THREE.Vector3(Math.cos(b) * L, 0, Math.sin(b) * L));
      return { mode: 'sky', anchor, p0, p1, phase: rr(0, 6.28), speed: (lap2 ? 0.32 : 0.18) * rr(0.8, 1.2), life: rr(10, 14), color };
    }
    // horizontal beam just above walkway height, sweeping across the player's tier
    const axis = Math.random() < 0.5 ? 0 : 1, y = (Player.grounded ? p.y : Player.groundY) + 0.45;
    const dirS = Math.random() < 0.5 ? -1 : 1, cur = axis === 0 ? p.z : p.x;
    const from = cur - dirS * rr(25, 35), to = cur + dirS * rr(25, 35);
    const speed = lap2 ? rr(3.5, 5) : rr(2.2, 3.2);
    return { mode: 'hsweep', axis, y, from, to, dur: Math.abs(to - from) / speed, life: Math.abs(to - from) / speed + CONFIG.LASER_TELEGRAPH, color };
  },
  // escape route: fixed laser gates, Rory ambush, two Screamer dashes (triggered by progress s)
  setupEscape() {
    const R = Chamber.route; if (!R) return;
    const color = CONFIG.COLORS.laser;
    const gate = (mark, kind, i) => {
      const m = R.marks[mark]; if (!m) return;
      const rx = -m.hz, rz = m.hx, w = 1.6 + 1.2, y = m.y;
      const L = (s) => new THREE.Vector3(m.x + rx * w * s, y, m.z + rz * w * s);
      let cfg;
      if (kind === 'low') { const a0 = L(-1), b0 = L(1); a0.y = b0.y = y + 0.45; cfg = { a0, b0 }; }
      else if (kind === 'diag') { const a0 = L(-1), b0 = L(1); a0.y = y + 0.2; b0.y = y + 2.6; cfg = { a0, b0 }; }
      else if (kind === 'diag2') { const a0 = L(-1), b0 = L(1); a0.y = y + 2.6; b0.y = y + 0.2; cfg = { a0, b0 }; }
      else { const a0 = L(-1), b0 = L(1); a0.y = b0.y = y + 1.2; cfg = { a0, b0, sweep: 1.3, amp: 0.85, phase: i }; }
      cfg.mode = 'fixed'; cfg.color = color; cfg.cycle = { on: 2.4, off: 1.1 }; cfg.s = m.s;
      cfg.near = () => Math.abs(Chamber.playerS - m.s) < 45;
      this.esc.gates.push({ laser: this.lasers[i], cfg, s: m.s, started: false });
    };
    this.esc = { gates: [], screams: [], rory: null };
    gate('laser1', 'low', 0); gate('laser2', 'diag', 1); gate('laser3', 'sweep', 2); gate('laser4', 'diag', 3);
    gate('laser4', 'diag2', 4); gate('laser5', 'low', 5); gate('laser6', 'diag', 6);
    for (const k of ['scream1', 'scream2']) if (R.marks[k]) this.esc.screams.push({ m: R.marks[k], done: false });
    if (R.marks.rory) this.esc.rory = { m: R.marks.rory, spawn: R.marks.roryspawn, done: false };
  },
  updateEscape(dt) {
    const s = Chamber.playerS, E = this.esc; if (!E) return;
    for (const g of E.gates) {
      const near = Math.abs(s - g.s) < 45;
      if (near && !g.started) { g.started = true; g.laser.start(g.cfg); }
      else if (!near && g.started && s > g.s + 45) { g.started = false; g.laser.stop(); }
    }
    for (const sc of E.screams) if (!sc.done && s > sc.m.s) { sc.done = true; Screamer.state = 'idle'; Screamer.trigger(new THREE.Vector3(-sc.m.hz, 0, sc.m.hx)); }
    if (E.rory && !E.rory.done && s > E.rory.m.s) {
      E.rory.done = true;
      const sp = E.rory.spawn;
      UI.announce('RORY IS COMING', { color: '#e6b0ff' }); Sfx.sting();
      Rory.spawnAt(sp.x, sp.y, sp.z, 15, this.roryEventSpeed(true));
    }
  },
  update(dt) {
    const m = this.mode;
    if (m === 'lap1' || m === 'lap2') {
      const lap2 = m === 'lap2', left = Collect.left, tr = diff().threat;
      if (!Rory.active) { this.roryT -= dt; if (this.roryT <= 0) { Rory.event(this.roryEventSpeed(lap2)); this.roryT = CONFIG.RORY_DURATION + this.roryGap(lap2); } }
      if (lap2 || left <= CONFIG.LASER_START_LEFT) {
        const max = lap2 ? CONFIG.LASER_MAX2 : CONFIG.LASER_MAX1;
        for (let i = 0; i < max; i++) {
          const l = this.lasers[i];
          if (!l.active) { this.laserT[i] -= dt; if (this.laserT[i] <= 0) { l.start(this.makeLaserCfg(lap2)); this.laserT[i] = rr(3, 6) / tr; } }
        }
      }
      if ((lap2 || left <= CONFIG.SCREAMER_START_LEFT) && Screamer.state === 'idle') {
        this.scrT -= dt;
        if (this.scrT <= 0) { Screamer.trigger(); const cd = lap2 ? CONFIG.SCREAMER_CD2 : CONFIG.SCREAMER_CD; this.scrT = rr(cd[0], cd[1]) / tr; }
      }
      if (lap2) {
        this.fireT -= dt;
        if (this.fireT <= 0) {
          const frac = clamp(Lap2.timeLeft / Lap2.timeMax, 0, 1);
          this.fireT = rr(...CONFIG.FIREBALL_GAP) * (0.45 + 0.55 * frac) / tr;
          this.spawnFireball();
        }
        if (this.headTimes.length && Lap2.timeLeft <= this.headTimes[0] && !WegaHead.active) { this.headTimes.shift(); WegaHead.spawn(); }
        for (const at of CONFIG.FLOOD_AT) if (left <= at && !this.floodsDone.has(at) && !Flood.active) { this.floodsDone.add(at); Flood.start(); }
      }
    } else if (m === 'escape') this.updateEscape(dt);
    if (m === 'off') return;
    Rory.update(dt); Screamer.update(dt); GlitchGuy.update(dt); WegaHead.update(dt); Flood.update(dt);
    for (const l of this.lasers) l.update(dt);
    for (const f of this.fireballs) f.update(dt);
  },
  spawnFireball() {
    const f = this.fireballs.find((x) => !x.busy); if (!f) return;
    const p = Player.pos; Rig.headForward(_v3);
    for (let i = 0; i < 12; i++) {
      const d = rr(1, CONFIG.FIREBALL_RANGE), a = rr(-1.4, 1.4) + Math.atan2(_v3.x, _v3.z);
      const x = p.x + Math.sin(a) * d * (i < 4 ? 0.6 : 1), z = p.z + Math.cos(a) * d * (i < 4 ? 0.6 : 1);
      const g = World.groundAt(x, z, p.y + 9);
      if (g > -Infinity && g > p.y - 9) { f.launch(_v1.set(x, g, z)); return; }
    }
  },
  unsafeAt(p) {
    for (const f of this.fireballs) if (f.state === 'burn' && Math.hypot(p.x - f.target.x, p.z - f.target.z) < 2.2) return true;
    return false;
  },
  onPlayerRespawn() { if (Rory.active) Rory.stunT = Math.max(Rory.stunT, 1.5); },
};

// STATES — state machine + every state's enter/update/exit, cutscene, screens, glue
// =====================================================================================
const GAMEPLAY = new Set(['LAP1', 'BEACON1', 'LAP2', 'BEACON2', 'IDOL_CHAMBER', 'ESCAPE']);
const TIMED = new Set(['LAP1', 'BEACON1', 'ENRAGED_CUTSCENE', 'LAP2', 'BEACON2', 'IDOL_CHAMBER', 'ESCAPE']);

const SM = {
  states: {}, cur: null, curName: '', seq: 0, paused: false,
  go(name, arg) {
    const prev = this.curName;
    if (this.paused) this.resume();
    if (this.cur && this.cur.exit) this.cur.exit(name);
    this.seq++; this.curName = name; this.cur = this.states[name];
    if (this.cur && this.cur.enter) this.cur.enter(arg || {}, prev);
  },
  isGameplay() { return !this.paused && GAMEPLAY.has(this.curName); },
  pause() {
    if (this.paused || !GAMEPLAY.has(this.curName) || Game.transitioning || Player.respawning) return;
    this.paused = true; Music.cuePause(true); PauseMenu.show();
  },
  resume() {
    if (!this.paused) return;
    this.paused = false; Music.cuePause(false); PauseMenu.hide();
  },
  togglePause() { if (this.paused) this.resume(); else this.pause(); },
  update(dt) {
    if (this.paused) return;
    if (TIMED.has(this.curName) && Game.timerOn) Game.runTime += dt;
    if (this.cur && this.cur.update) this.cur.update(dt);
  },
};

      await Fade.to(1, 0.5, 0x3a0000);
      if (tok !== SM.seq) return;
      hideWorld(); HUD.setVisible(false); Collect.hide(); Idol.detach();
      if (Chamber.rumble) { Chamber.rumble.stop(0.3); Chamber.rumble = null; }
      setLook('dead'); G.stage.visible = true;
      Player.locomotion = 'turn';
      Stage.showDead(reason);
      UI.setActive([Stage.deadPanel]);
      Sfx.laugh(); Captions.show('[ WEGA LAUGHS ]', 2.0);
      await Fade.to(0, 0.6);
    })();
  },
  update(dt) { Player.update(dt); Stage.updateDead(dt); },
  exit() { Stage.hideAll(); UI.setActive([]); scene.background.set(0x000000); },
};

function recenter() {
  HUD.follow.reset = true; Announce.follow.reset = true; Player.recenterOnHead = true;
  if (SM.paused) placeFront(PauseMenu.panel.mesh, 1.5, -0.05);
  if (Stage.deadPanel.mesh.visible) Stage.showDead(Stage.reason);
  if (Stage.winPanel.mesh.visible) { placeFront(Stage.doodle, 2.6, 0.05, 0.36); placeFront(Stage.winPanel.mesh, 2.6, 0.05, -0.36); }
  if (Stage.typeMesh.visible) placeFront(Stage.typeMesh, 3, 0);
  UI.toast('RECENTERED');
  Hands.pulse('both', 0.3, 60);
}

// ---------------- debug hooks ----------------
const Debug = {
  busy: false,
  async jump(target) {
    if (this.busy) return; this.busy = true;
    try {
      AudioSys.ensure();
      if (SM.paused) SM.resume();
      const tok = ++Game.transTok; Game.transitioning = true;
      await Fade.to(1, 0.3, 0x000000);
      if (tok !== Game.transTok) return;
      Hazards.clear(); Beacon.hide(); Announce.clear(); Stage.hideAll(); Confetti.stop();
      Game.debugRun = true;
      if (!Game.timerOn) { Game.runTime = 0; Game.timerOn = true; Game.collectedTotal = 0; Player.resetStats(); }
      Game.transitioning = false;
      if (target === 'LAP1') { setupLap(1); SM.go('LAP1', { fresh: true }); }
      else if (target === 'LAP2') { setupLap(2); SM.go('LAP2', { retry: true }); }
      else if (target === 'IDOL') SM.go('IDOL_CHAMBER');
      else if (target === 'ESCAPE') SM.go('ESCAPE', { retry: true });
      else if (target === 'WIN') { Chamber.dispose(); Idol.detach(); Collect.hide(); Game.timerOn = false; SM.go('WIN'); }
      await Fade.to(0, 0.4);
    } finally { this.busy = false; }
  },
};
window.WEGA_DEBUG = {
  skipToLap2: () => Debug.jump('LAP2'),
  skipToIdol: () => Debug.jump('IDOL'),
  skipToEscape: () => Debug.jump('ESCAPE'),
  win: () => Debug.jump('WIN'),
  lap1: () => Debug.jump('LAP1'),
  godMode: (on = true) => { Player.godMode = !!on; if (on) Game.debugRun = true; return Player.godMode; },
  setLeft: (n) => { if (Collect.mesh.visible) { Game.debugRun = true; Collect.setLeft(n); } return Collect.left; },
  state: () => SM.curName,
  player: () => ({ pos: Player.pos.toArray().map((v) => +v.toFixed(2)), hp: Player.hp, speed: +(Player.hspeed * CONFIG.SPEED_MULT).toFixed(1), grounded: Player.grounded }),
};
// test/debug access to internals (only with ?debug in the URL)
if (DEBUG_URL) window.WEGA_DEBUG.internals = { SM, Player, Collect, Beacon, Chamber, Hazards, Game, Rory, Screamer, Lap2, Flood, WegaHead, GlitchGuy, Idol, Music, HUD, Maze, Nav, World, Rig, Input, Fade, AudioSys, Save, Lobby, Stage, UI, get renderer() { return renderer; }, get scene() { return scene; }, get camera() { return camera; }, get perf() { return { upd: +Perf.upd.toFixed(2), ren: +Perf.ren.toFixed(2), calls: renderer.info.render.calls, tris: renderer.info.render.triangles }; } };

// =====================================================================================
// MAIN LOOP
// =====================================================================================
let lastT = 0, fpsAcc = 0, fpsFrames = 0;
function loop() {
  const now = performance.now();
  let dt = lastT ? (now - lastT) / 1000 : 0.016;
  lastT = now;
  dt = Math.min(0.05, Math.max(0, dt));
  Clock.real += dt;
  fpsAcc += dt; fpsFrames++;
  if (fpsAcc >= 0.5) { Wrist.fps = Math.round(fpsFrames / fpsAcc); fpsAcc = 0; fpsFrames = 0; if (Save.s.fps && !XR.inVR) DOM.hint.textContent = Wrist.fps + ' FPS'; }

  Input.poll(dt);
  if (Input.pausePressed) SM.togglePause();
  if (Input.recenter) recenter();
  if (!SM.paused) { Clock.update(dt); Billboards.uTime.value += dt; }

  const lvl = Music.getLevel();
  try { SM.update(dt); } catch (e) { console.error('[Wega] state update error', e); }

  if (!SM.paused) {
    Maze.update(lvl);
    Beacon.update(dt);
    if (G.chamber.visible) Chamber.update(dt, lvl);
    FX.update(dt);
    Decals.update(dt);
    BonusPop.update(dt);
  }
  Sky.update(dt, lvl);
  Fade.update(dt);
  Effects.update(dt);
  HUD.update(dt, lvl);
  Announce.update(dt);
  Wrist.update(dt);
  Toast.update(dt);
  Captions.update(dt);
  Ouch.update(dt);
  UI.update();
  AudioSys.updateListener();
  const tr = performance.now();
  renderer.render(scene, camera);
  const te = performance.now();
  Perf.upd = Perf.upd * 0.95 + (tr - now) * 0.05; Perf.ren = Perf.ren * 0.95 + (te - tr) * 0.05;
}
const Perf = { upd: 0, ren: 0 };

// compile every shader up front so nothing hitches mid-run on Quest
function warmup() {
  const groups = Object.values(G), vis = groups.map((g) => g.visible);
  groups.forEach((g) => { g.visible = true; });
  const extra = [Sky.dome, Sky.lava, Sky.embers, Beacon.group, SkyFace.group, PauseMenu.panel.mesh];
  const ev = extra.map((o) => o.visible); extra.forEach((o) => { o.visible = true; });
  const hidden = [];
  scene.traverse((o) => { if (!o.visible && (o.isMesh || o.isSprite || o.isPoints)) { hidden.push(o); o.visible = true; } });
  try {
    Maze.build(2); Collect.setup(placeCollectibles(Maze.cur, CONFIG.LAP2_SEED));
    renderer.compile(scene, camera);
    Chamber.build(); Idol.placeOnPedestal(Chamber.pedestal);
    renderer.compile(scene, camera);
    Chamber.dispose(); Idol.detach();
    Maze.build(1); Collect.setup(placeCollectibles(Maze.cur, CONFIG.LAP1_SEED));
    renderer.compile(scene, camera);
  } catch (e) { console.warn('[Wega] warmup failed', e); }
  hidden.forEach((o) => { o.visible = false; });
  extra.forEach((o, i) => { o.visible = ev[i]; });
  groups.forEach((g, i) => { g.visible = vis[i]; });
  Collect.hide();
}

function init() {
  Save.load();
  initRenderer();
  buildTextures();
  Fade.init(); Effects.init(); HUD.init(); Announce.init(); Wrist.init(); Toast.init(); Captions.init(); Ouch.init();
  Hands.init(); Input.initDesktop();
  FX.init(); Decals.init();
  Sky.init(); Beacon.init(); Maze.init(); Lobby.init();
  buildEnvMap(); Idol.init();
  Collect.init(); Confetti.init(); Hazards.init();
  Stage.init(); SkyFace.init(); PauseMenu.init(); BonusPop.init();
  warmup();

  renderer.xr.addEventListener('sessionstart', () => XR.onStart());
  renderer.xr.addEventListener('sessionend', () => XR.onEnd());

  SM.go('LOADING');
  SM.go('LOBBY');
  Fade.set(1, 0x000000); Fade.to(0, 1.0);
  renderer.setAnimationLoop(loop);

  // ---- DOM overlay: Click to play / Enter VR ----
  DOM.status.textContent = window.WegaMusic ? 'READY' : 'READY (wega-music.js not found: playing without music)';
  DOM.btnDesktop.disabled = false;
  DOM.btnDesktop.addEventListener('click', () => {
    AudioSys.ensure();
    DOM.overlay.classList.add('hidden');
    DOM.hint.textContent = 'WASD move · mouse look · Space jump · E grab · Shift sprint lock · Esc pause · M mute';
    Game.relockPointer();
  });
  DOM.btnVR.addEventListener('click', () => XR.enter());
  XR.check().then((ok) => {
    DOM.btnVR.disabled = !ok;
    DOM.btnVR.textContent = ok ? 'ENTER VR' : (window.isSecureContext ? 'VR NOT AVAILABLE' : 'VR NEEDS HTTPS');
  });
  if (DEBUG_URL) console.log('[Wega] debug: keys 1-5 jump to Lap 1 / Lap 2 / Idol / Escape / Win. window.WEGA_DEBUG is available.');
}

try { init(); } catch (e) {
  console.error('[Wega] init failed', e);
  DOM.status.textContent = 'Failed to start: ' + (e && e.message ? e.message : e);
}
</script>
